apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web-app
  labels:
    app: sample-python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-python-app
  template:
    metadata:
      labels:
        app: sample-python-app
    spec:
      containers:
      - name: python-app
        image: soham2572004/python-web-app-demo:v1 
        ports:
        - containerPort: 8000

